<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub 自动提交工具</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">GitHub 自动提交工具</h1>
        
        <div class="card">
            <div class="card-body">
                <form id="commitForm">
                    <div class="mb-3">
                        <label for="repo" class="form-label">仓库</label>
                        <select id="repo" class="form-select" required>
                            <option value="">加载中...</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label for="file" class="form-label">文件路径</label>
                        <input type="text" id="file" class="form-control" placeholder="例如: README.md" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="content" class="form-label">文件内容</label>
                        <textarea id="content" class="form-control" rows="10" required></textarea>
                    </div>
                    
                    <div class="mb-3">
                        <label for="message" class="form-label">提交信息</label>
                        <input type="text" id="message" class="form-control" placeholder="例如: Update README" value="Auto commit from web interface">
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100">提交到 GitHub</button>
                </form>
            </div>
        </div>
        
        <div id="response" class="mt-4 alert d-none"></div>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 加载仓库列表
        async function loadRepos() {
            try {
                const response = await fetch('http://localhost:5000/api/repos');
                const data = await response.json();
                
                if (data.error) {
                    showResponse('error', data.error);
                    return;
                }
                
                const repoSelect = document.getElementById('repo');
                repoSelect.innerHTML = '<option value="">选择仓库</option>';
                
                data.repos.forEach(repo => {
                    const option = document.createElement('option');
                    option.value = repo.full_name;
                    option.textContent = repo.name;
                    repoSelect.appendChild(option);
                });
            } catch (error) {
                showResponse('error', '无法加载仓库列表: ' + error.message);
            }
        }
        
        // 显示响应信息
        function showResponse(type, message) {
            const responseDiv = document.getElementById('response');
            responseDiv.className = `mt-4 alert alert-${type}`;
            responseDiv.textContent = message;
            responseDiv.classList.remove('d-none');
            
            // 3秒后自动隐藏
            setTimeout(() => {
                responseDiv.classList.add('d-none');
            }, 3000);
        }
        
        // 提交表单
        document.getElementById('commitForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const repo = document.getElementById('repo').value;
            const file = document.getElementById('file').value;
            const content = document.getElementById('content').value;
            const message = document.getElementById('message').value;
            
            if (!repo) {
                showResponse('warning', '请选择仓库');
                return;
            }
            
            try {
                const response = await fetch('http://localhost:5000/api/commit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ repo, file, content, message })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showResponse('success', data.message);
                } else {
                    showResponse('error', data.error);
                }
            } catch (error) {
                showResponse('error', '提交失败: ' + error.message);
            }
        });
        
        // 页面加载时加载仓库列表
        window.onload = loadRepos;
    </script>
</body>
</html>
